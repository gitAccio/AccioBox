- {"id": "ottica-1", "nome": "Legge di Snell", "latex": " n1\\cdot\\sin\\left( t1\\right) =  n2\\cdot\\sin\\left( t2\\right)", "expr": "n1*sin(t1) = n2*sin(t2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Interfaccia piana tra mezzi isotropi; angoli dalla normale.", "variabili": {"n1": "Indice 1", "t1": "Angolo di incidenza", "n2": "Indice 2", "t2": "Angolo di rifrazione"}}
- {"id": "ottica-2", "nome": "Indice di rifrazione", "latex": " n = \\frac{ c}{ v}", "expr": "n = c/v", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "c velocità della luce nel vuoto.", "variabili": {"n": "Indice [-]", "c": "Velocità nel vuoto [m/s]", "v": "Velocità nel mezzo [m/s]"}}
