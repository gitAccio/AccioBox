- {"id": "chimica-fisica-6", "nome": "Equazione di Clausius-Clapeyron (integrata)", "latex": "\\ln\\left(\\frac{ p2}{ p1}\\right) = \\frac{-\\mathrm{dH}}{8.314462618}\\cdot\\left(\\frac{1}{ T2}-\\frac{1}{ T1}\\right)", "expr": "log(p2/p1) = -dH/8.314462618*(1/T2 - 1/T1)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "dH (J/mol) costante, vapore ideale, volume del liquido trascurabile.", "variabili": {"p1": "Pressione 1", "p2": "Pressione 2", "dH": "Entalpia di vaporizzazione [J/mol]", "T1": "Temperatura 1 [K]", "T2": "Temperatura 2 [K]"}}
