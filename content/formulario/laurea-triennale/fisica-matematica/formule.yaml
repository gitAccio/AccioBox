- {"id": "analisi-matematica-iii-1", "nome": "Equazioni di Cauchy-Riemann", "latex": "u_x=v_y,\\quad u_y=-v_x", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f=u+iv olomorfa."}
- {"id": "analisi-matematica-iii-2", "nome": "Formula di Eulero", "latex": "e^{i\\theta}=\\cos\\theta+i\\sin\\theta", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "θ in radianti."}
- {"id": "analisi-matematica-iii-3", "nome": "Formula di De Moivre", "latex": "(\\cos\\theta+i\\sin\\theta)^n=\\cos n\\theta+i\\sin n\\theta", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "n intero."}
- {"id": "analisi-matematica-iii-4", "nome": "Teorema dei residui", "latex": "\\oint_\\gamma f(z)\\,dz=2\\pi i\\sum_k \\mathrm{Res}(f,z_k)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f olomorfa tranne singolarità isolate z_k interne a γ (curva chiusa semplice orientata positivamente)."}
- {"id": "trasformate-di-fourier-1", "nome": "Pulsazione fondamentale", "latex": " omega0 = \\frac{2\\cdot\\pi}{T}", "expr": "omega0 = 2*pi/T", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "T periodo del segnale.", "variabili": {"omega0": "Pulsazione fondamentale [rad/s]", "T": "Periodo [s]"}}
- {"id": "trasformate-di-fourier-2", "nome": "Serie di Fourier (forma reale)", "latex": "f(t)=\\tfrac{a_0}2+\\sum_{n\\ge1}\\big(a_n\\cos n\\omega_0t+b_n\\sin n\\omega_0t\\big),\\ a_n=\\tfrac2T\\!\\int_0^T\\!f\\cos n\\omega_0t\\,dt,\\ b_n=\\tfrac2T\\!\\int_0^T\\!f\\sin n\\omega_0t\\,dt", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f periodica di periodo T, regolare a tratti."}
- {"id": "trasformate-di-fourier-3", "nome": "Trasformata di Fourier (convenzione con e^{-iωt})", "latex": "F(\\omega)=\\int_{-\\infty}^{\\infty}f(t)e^{-i\\omega t}dt,\\quad f(t)=\\frac1{2\\pi}\\int F(\\omega)e^{i\\omega t}d\\omega", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Esistono altre convenzioni di normalizzazione: verificare quella del proprio testo."}
- {"id": "trasformate-di-fourier-4", "nome": "Teorema di convoluzione", "latex": "\\mathcal F\\{f*g\\}=F\\cdot G", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Con la convenzione sopra."}
- {"id": "trasformate-di-laplace-1", "nome": "Definizione", "latex": "\\mathcal L\\{f\\}(s)=\\int_0^\\infty f(t)e^{-st}dt", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Per Re(s) abbastanza grande."}
- {"id": "trasformate-di-laplace-2", "nome": "Trasformate elementari", "latex": "\\mathcal L\\{1\\}=\\tfrac1s,\\ \\mathcal L\\{t^n\\}=\\tfrac{n!}{s^{n+1}},\\ \\mathcal L\\{e^{at}\\}=\\tfrac1{s-a}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Per Re(s) > max(0, a)."}
- {"id": "trasformate-di-laplace-3", "nome": "Trasformate di seno e coseno", "latex": "\\mathcal L\\{\\sin\\omega t\\}=\\frac{\\omega}{s^2+\\omega^2},\\quad \\mathcal L\\{\\cos\\omega t\\}=\\frac{s}{s^2+\\omega^2}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Re(s) > 0."}
- {"id": "trasformate-di-laplace-4", "nome": "Trasformata della derivata", "latex": "\\mathcal L\\{f'\\}=sF(s)-f(0^-)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f continua per t>0 e di ordine esponenziale."}
- {"id": "trasformate-di-laplace-5", "nome": "Teorema della traslazione", "latex": "\\mathcal L\\{e^{at}f(t)\\}=F(s-a)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Nessuna ipotesi particolare oltre a quelle del modello classico."}
