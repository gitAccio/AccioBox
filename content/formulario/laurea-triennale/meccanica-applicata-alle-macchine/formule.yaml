- {"id": "meccanica-delle-vibrazioni-1", "nome": "Pulsazione naturale", "latex": " omegan = \\sqrt{\\frac{ k}{m}}", "expr": "omegan = sqrt(k/m)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Sistema a un grado di libertà non smorzato.", "variabili": {"omegan": "Pulsazione naturale [rad/s]", "k": "Rigidezza [N/m]", "m": "Massa [kg]"}}
- {"id": "meccanica-delle-vibrazioni-2", "nome": "Rapporto di smorzamento", "latex": "\\zeta = \\frac{ c}{2\\cdot\\sqrt{ k\\cdotm}}", "expr": "zeta = c/(2*sqrt(k*m))", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Smorzamento viscoso.", "variabili": {"zeta": "Rapporto di smorzamento [-]", "c": "Smorzamento [N s/m]", "k": "Rigidezza [N/m]", "m": "Massa [kg]"}}
- {"id": "meccanica-delle-vibrazioni-3", "nome": "Pulsazione smorzata", "latex": " omegad =  omegan\\cdot\\sqrt{1-{\\zeta}^{2}}", "expr": "omegad = omegan*sqrt(1 - zeta^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "zeta < 1.", "variabili": {"omegad": "Pulsazione smorzata [rad/s]", "omegan": "Pulsazione naturale [rad/s]", "zeta": "Rapporto di smorzamento [-]"}}
- {"id": "meccanica-delle-vibrazioni-4", "nome": "Decremento logaritmico", "latex": "\\delta = \\frac{2\\cdot\\pi\\cdot\\zeta}{\\sqrt{1-{\\zeta}^{2}}}", "expr": "delta = 2*pi*zeta/sqrt(1 - zeta^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Sistema sottosmorzato.", "variabili": {"delta": "Decremento logaritmico [-]", "zeta": "Rapporto di smorzamento [-]"}}
- {"id": "meccanica-delle-vibrazioni-5", "nome": "Fattore di amplificazione dinamica", "latex": " D = \\frac{1}{\\sqrt{{\\left(1-{ r}^{2}\\right)}^{2}+{\\left(2\\cdot\\zeta\\cdot r\\right)}^{2}}}", "expr": "D = 1/sqrt((1 - r^2)^2 + (2*zeta*r)^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Forzante armonica; r rapporto tra pulsazione forzante e naturale.", "variabili": {"D": "Fattore di amplificazione [-]", "r": "Rapporto di frequenze [-]", "zeta": "Rapporto di smorzamento [-]"}}
- {"id": "meccanica-delle-vibrazioni-6", "nome": "Trasmissibilità di forza", "latex": " TR = \\frac{\\sqrt{1+{\\left(2\\cdot\\zeta\\cdot r\\right)}^{2}}}{\\sqrt{{\\left(1-{ r}^{2}\\right)}^{2}+{\\left(2\\cdot\\zeta\\cdot r\\right)}^{2}}}", "expr": "TR = sqrt(1 + (2*zeta*r)^2)/sqrt((1 - r^2)^2 + (2*zeta*r)^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Forzante armonica; r rapporto di frequenze.", "variabili": {"TR": "Trasmissibilità [-]", "r": "Rapporto di frequenze [-]", "zeta": "Rapporto di smorzamento [-]"}}
- {"id": "meccanica-delle-vibrazioni-7", "nome": "Rigidezza di molle in serie", "latex": " k = \\frac{1}{\\frac{1}{ k1}+\\frac{1}{ k2}}", "expr": "k = 1/(1/k1 + 1/k2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Due molle.", "variabili": {"k": "Rigidezza equivalente [N/m]", "k1": "Rigidezza 1 [N/m]", "k2": "Rigidezza 2 [N/m]"}}
- {"id": "meccanica-delle-vibrazioni-8", "nome": "Rigidezza di molle in parallelo", "latex": " k =  k1+ k2", "expr": "k = k1 + k2", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Due molle.", "variabili": {"k": "Rigidezza equivalente [N/m]", "k1": "Rigidezza 1 [N/m]", "k2": "Rigidezza 2 [N/m]"}}
- {"id": "meccanica-applicata-alle-macchine-1", "nome": "Interasse di ingranaggi cilindrici a denti dritti", "latex": " a = \\frac{m\\cdot\\left( z1+ z2\\right)}{2}", "expr": "a = m*(z1 + z2)/2", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Ruote non corrette, stesso modulo m.", "variabili": {"a": "Interasse [mm]", "m": "Modulo [mm]", "z1": "Denti ruota 1 [-]", "z2": "Denti ruota 2 [-]"}}
