- {"id": "algoritmi-1", "nome": "Ricerca binaria", "latex": "T(n)=O(\\log n)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Array ordinato ad accesso casuale."}
- {"id": "algoritmi-2", "nome": "Ordinamenti per confronto", "latex": "T(n)=\\Omega(n\\log n)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Limite inferiore per gli algoritmi basati su confronti."}
- {"id": "algoritmi-3", "nome": "Quicksort", "latex": "T_{medio}(n)=O(n\\log n),\\quad T_{peggiore}(n)=O(n^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Scelta del pivot casuale/media."}
- {"id": "algoritmi-4", "nome": "Teorema dell'esperto (Master theorem)", "latex": "T(n)=aT(n/b)+f(n)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "a ≥ 1, b > 1: il confronto di f(n) con n^{log_b a} stabilisce quale dei tre casi si applica."}
