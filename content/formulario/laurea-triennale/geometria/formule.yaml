- {"id": "geometria-4", "nome": "Formula di Erone", "latex": "A = \\sqrt{\\frac{ a+b+ c}{2}\\cdot\\left(\\frac{ a+b+ c}{2}- a\\right)\\cdot\\left(\\frac{ a+b+ c}{2}-b\\right)\\cdot\\left(\\frac{ a+b+ c}{2}- c\\right)}", "expr": "A = sqrt(((a + b + c)/2)*((a + b + c)/2 - a)*((a + b + c)/2 - b)*((a + b + c)/2 - c))", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Triangolo con lati a, b, c.", "variabili": {"A": "Area", "a": "Lato", "b": "Lato", "c": "Lato"}}
