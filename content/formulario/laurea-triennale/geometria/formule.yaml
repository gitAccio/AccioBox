- {"id": "geometria-analitica-1", "nome": "Distanza tra due punti", "latex": " d = \\sqrt{{\\left( x2- x1\\right)}^{2}+{\\left( y2- y1\\right)}^{2}}", "expr": "d = sqrt((x2 - x1)^2 + (y2 - y1)^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Piano cartesiano ortogonale.", "variabili": {"d": "Distanza", "x1": "x del punto 1", "y1": "y del punto 1", "x2": "x del punto 2", "y2": "y del punto 2"}}
- {"id": "geometria-analitica-2", "nome": "Coefficiente angolare della retta per due punti", "latex": "m = \\frac{ y2- y1}{ x2- x1}", "expr": "m = (y2 - y1)/(x2 - x1)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "x1 diverso da x2.", "variabili": {"m": "Coefficiente angolare", "x1": "x punto 1", "y1": "y punto 1", "x2": "x punto 2", "y2": "y punto 2"}}
- {"id": "geometria-analitica-3", "nome": "Distanza punto-retta", "latex": " d = \\frac{\\left| a\\cdot x0+b\\cdot y0+ c\\right|}{\\sqrt{{ a}^{2}+{b}^{2}}}", "expr": "d = abs(a*x0 + b*y0 + c)/sqrt(a^2 + b^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Retta ax+by+c=0; punto (x0,y0).", "variabili": {"d": "Distanza", "a": "Coeff. a", "b": "Coeff. b", "c": "Termine noto", "x0": "x del punto", "y0": "y del punto"}}
- {"id": "geometria-analitica-4", "nome": "Equazione della circonferenza", "latex": "{\\left( x- xc\\right)}^{2}+{\\left( y- yc\\right)}^{2} = { r}^{2}", "expr": "(x - xc)^2 + (y - yc)^2 = r^2", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Centro (xc,yc), raggio r.", "variabili": {"x": "x di un punto", "y": "y di un punto", "xc": "x del centro", "yc": "y del centro", "r": "Raggio"}}
- {"id": "geometria-analitica-5", "nome": "Equazione dell'ellisse canonica", "latex": "\\frac{{ x}^{2}}{{ a}^{2}}+\\frac{{ y}^{2}}{{b}^{2}} = 1", "expr": "x^2/a^2 + y^2/b^2 = 1", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Centro nell'origine, assi sugli assi coordinati.", "variabili": {"x": "x di un punto", "y": "y di un punto", "a": "Semiasse lungo x", "b": "Semiasse lungo y"}}
