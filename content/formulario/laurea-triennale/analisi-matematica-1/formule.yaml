- {"id": "trig-coseni", "nome": "Teorema del coseno (Carnot)", "latex": "c^2 = a^2+b^2-2ab\\cos\\gamma", "expr": "c^2 = a^2 + b^2 - 2*a*b*cos(gamma)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Triangolo qualsiasi; gamma opposto al lato c; usare la modalità angolare corretta.", "variabili": {"a": "Lato [m]", "b": "Lato [m]", "c": "Lato opposto a gamma [m]", "gamma": "Angolo [rad o deg secondo modalità]"}}
- {"id": "trigonometria-1", "nome": "Teorema dei seni", "latex": "\\frac{ a}{\\sin\\left(A\\right)} = \\frac{b}{\\sin\\left(B\\right)}", "expr": "a/sin(A) = b/sin(B)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Triangolo qualsiasi; angoli nella modalità DEG/RAD attiva.", "variabili": {"a": "Lato opposto ad A", "A": "Angolo", "b": "Lato opposto a B", "B": "Angolo"}}
- {"id": "trigonometria-2", "nome": "Area del triangolo con due lati e l'angolo compreso", "latex": "A = \\frac{ a\\cdotb\\cdot\\sin\\left(\\gamma\\right)}{2}", "expr": "A = a*b*sin(gamma)/2", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "gamma è l'angolo tra a e b.", "variabili": {"A": "Area", "a": "Lato", "b": "Lato", "gamma": "Angolo compreso"}}
- {"id": "trigonometria-3", "nome": "Raggio della circonferenza circoscritta", "latex": " R = \\frac{ a}{2\\cdot\\sin\\left(A\\right)}", "expr": "R = a/(2*sin(A))", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Triangolo qualsiasi.", "variabili": {"R": "Raggio", "a": "Lato", "A": "Angolo opposto al lato a"}}
- {"id": "trigonometria-4", "nome": "Identità fondamentale", "latex": "\\sin^2\\alpha+\\cos^2\\alpha=1", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Valida per ogni angolo."}
- {"id": "trigonometria-5", "nome": "Formule di addizione", "latex": "\\sin(\\alpha\\pm\\beta)=\\sin\\alpha\\cos\\beta\\pm\\cos\\alpha\\sin\\beta,\\quad \\cos(\\alpha\\pm\\beta)=\\cos\\alpha\\cos\\beta\\mp\\sin\\alpha\\sin\\beta", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Valide per ogni coppia di angoli."}
- {"id": "trigonometria-6", "nome": "Formule di duplicazione", "latex": "\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha,\\quad \\cos 2\\alpha=\\cos^2\\alpha-\\sin^2\\alpha", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Valide per ogni angolo."}
- {"id": "calcolo-differenziale-1", "nome": "Derivata della potenza", "latex": "\\frac{d}{dx}x^n=n\\,x^{n-1}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "n reale; x nel dominio."}
- {"id": "calcolo-differenziale-2", "nome": "Derivate di esponenziale e logaritmo", "latex": "\\frac{d}{dx}e^x=e^x,\\quad \\frac{d}{dx}\\ln x=\\frac1x", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "x>0 per il logaritmo."}
- {"id": "calcolo-differenziale-3", "nome": "Derivate delle funzioni trigonometriche", "latex": "(\\sin x)'=\\cos x,\\quad (\\cos x)'=-\\sin x,\\quad (\\tan x)'=\\frac1{\\cos^2 x}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "x in radianti."}
- {"id": "calcolo-differenziale-4", "nome": "Regola del prodotto", "latex": "(fg)'=f'g+fg'", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f, g derivabili."}
- {"id": "calcolo-differenziale-5", "nome": "Regola del quoziente", "latex": "\\left(\\frac fg\\right)'=\\frac{f'g-fg'}{g^2}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "g diverso da zero."}
- {"id": "calcolo-differenziale-6", "nome": "Regola della catena", "latex": "\\frac{d}{dx}f(g(x))=f'(g(x))\\,g'(x)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f e g derivabili."}
- {"id": "calcolo-integrale-1", "nome": "Integrale della potenza", "latex": "\\int x^n\\,dx=\\frac{x^{n+1}}{n+1}+C", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "n diverso da −1."}
- {"id": "calcolo-integrale-2", "nome": "Integrali elementari", "latex": "\\int\\frac{dx}{x}=\\ln|x|+C,\\ \\int e^x dx=e^x+C,\\ \\int\\sin x\\,dx=-\\cos x+C,\\ \\int\\cos x\\,dx=\\sin x+C", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "x diverso da 0 nel primo caso."}
- {"id": "calcolo-integrale-3", "nome": "Integrazione per parti", "latex": "\\int f\\,g'\\,dx=fg-\\int f'\\,g\\,dx", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f, g derivabili."}
- {"id": "calcolo-integrale-4", "nome": "Teorema fondamentale del calcolo integrale", "latex": "\\int_a^b f(x)\\,dx=F(b)-F(a)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f continua su [a,b], F primitiva di f."}
- {"id": "calcolo-integrale-5", "nome": "Valor medio integrale", "latex": "\\bar f=\\frac1{b-a}\\int_a^b f(x)\\,dx", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f integrabile su [a,b]."}
- {"id": "alg-quad", "nome": "Formula risolutiva (radice con segno +)", "latex": "x = \\frac{-b+\\sqrt{b^2-4ac}}{2a}", "expr": "x = (-b + sqrt(b^2-4*a*c))/(2*a)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Equazione a x^2+bx+c=0 con a≠0; discriminante ≥ 0 per radici reali.", "variabili": {"x": "Radice [-]", "a": "Coeff. di x^2 [-]", "b": "Coeff. di x [-]", "c": "Termine noto [-]"}}
- {"id": "alg-disc", "nome": "Discriminante", "latex": "\\Delta = b^2-4ac", "expr": "D = b^2 - 4*a*c", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Equazione di secondo grado.", "variabili": {"D": "Discriminante [-]", "a": "Coeff. a [-]", "b": "Coeff. b [-]", "c": "Coeff. c [-]"}}
- {"id": "alg-pa", "nome": "Termine n-esimo di una progressione aritmetica", "latex": "a_n = a_1+(n-1)d", "expr": "an = a1 + (n-1)*d", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Differenza costante d.", "variabili": {"an": "Termine n-esimo [-]", "a1": "Primo termine [-]", "n": "Posizione [-]", "d": "Differenza [-]"}}
- {"id": "alg-sg", "nome": "Somma dei primi n termini di una progressione geometrica", "latex": "S_n = a_1\\frac{1-q^n}{1-q}", "expr": "S = a1*(1-q^n)/(1-q)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Ragione q diversa da 1.", "variabili": {"S": "Somma [-]", "a1": "Primo termine [-]", "q": "Ragione [-]", "n": "Numero di termini [-]"}}
- {"id": "algebra-1", "nome": "Cambio di base del logaritmo", "latex": " y = \\frac{\\ln\\left( x\\right)}{\\ln\\left(b\\right)}", "expr": "y = log(x)/log(b)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "x>0, b>0, b diverso da 1.", "variabili": {"y": "Logaritmo in base b", "x": "Argomento", "b": "Base"}}
- {"id": "algebra-2", "nome": "Termine n-esimo di una progressione geometrica", "latex": " an =  a1\\cdot{ q}^{ n-1}", "expr": "an = a1*q^(n - 1)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Ragione q costante.", "variabili": {"an": "Termine n-esimo", "a1": "Primo termine", "q": "Ragione", "n": "Posizione"}}
- {"id": "algebra-3", "nome": "Somma di una progressione aritmetica", "latex": "S = \\frac{ n\\cdot\\left( a1+ an\\right)}{2}", "expr": "S = n*(a1 + an)/2", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Differenza costante.", "variabili": {"S": "Somma", "n": "Numero di termini", "a1": "Primo termine", "an": "Ultimo termine"}}
- {"id": "algebra-4", "nome": "Somma della serie geometrica infinita", "latex": "S = \\frac{ a1}{1- q}", "expr": "S = a1/(1 - q)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Solo se |q| < 1.", "variabili": {"S": "Somma", "a1": "Primo termine", "q": "Ragione"}}
- {"id": "analisi-matematica-i-1", "nome": "Limiti notevoli", "latex": "\\lim_{x\\to0}\\frac{\\sin x}{x}=1,\\quad \\lim_{x\\to0}\\frac{1-\\cos x}{x^2}=\\frac12,\\quad \\lim_{x\\to0}\\frac{e^x-1}{x}=1,\\quad \\lim_{x\\to0}\\frac{\\ln(1+x)}{x}=1", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "x in radianti."}
- {"id": "analisi-matematica-i-2", "nome": "Limite che definisce e", "latex": "\\lim_{n\\to\\infty}\\left(1+\\frac1n\\right)^n=e", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Nessuna ipotesi particolare oltre a quelle del modello classico."}
- {"id": "analisi-matematica-i-3", "nome": "Teorema di Lagrange", "latex": "\\exists c\\in(a,b):\\ f'(c)=\\frac{f(b)-f(a)}{b-a}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f continua su [a,b], derivabile su (a,b)."}
- {"id": "analisi-matematica-i-4", "nome": "Sviluppi di Maclaurin", "latex": "e^x=\\sum_{n\\ge0}\\frac{x^n}{n!},\\ \\sin x=\\sum_{n\\ge0}\\frac{(-1)^n x^{2n+1}}{(2n+1)!},\\ \\cos x=\\sum_{n\\ge0}\\frac{(-1)^n x^{2n}}{(2n)!}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Validi per ogni x reale."}
