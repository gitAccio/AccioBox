- {"id": "calcolo-multivariabile-1", "nome": "Raggio in coordinate polari", "latex": " r = \\sqrt{{ x}^{2}+{ y}^{2}}", "expr": "r = sqrt(x^2 + y^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Piano.", "variabili": {"r": "Raggio", "x": "x", "y": "y"}}
