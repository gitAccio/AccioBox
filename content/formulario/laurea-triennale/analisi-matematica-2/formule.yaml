- {"id": "calcolo-multivariabile-4", "nome": "Teorema della divergenza", "latex": "\\iiint_V \\nabla\\!\\cdot\\!\\mathbf F\\,dV=\\oiint_{\\partial V}\\mathbf F\\cdot\\mathbf n\\,dS", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "F di classe C¹ su V; n normale uscente."}
- {"id": "calcolo-multivariabile-5", "nome": "Teorema di Stokes", "latex": "\\iint_S(\\nabla\\times\\mathbf F)\\cdot\\mathbf n\\,dS=\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Orientazioni compatibili, F di classe C¹."}
- {"id": "serie-numeriche-1", "nome": "Serie geometrica", "latex": "\\sum_{n=0}^\\infty q^n=\\frac1{1-q}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Converge se e solo se |q|<1."}
- {"id": "serie-numeriche-2", "nome": "Serie armonica generalizzata", "latex": "\\sum_{n=1}^\\infty\\frac1{n^p}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Converge se e solo se p>1."}
- {"id": "serie-numeriche-3", "nome": "Condizione necessaria di convergenza", "latex": "\\sum a_n\\ \\text{converge}\\Rightarrow a_n\\to0", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Non è sufficiente (vedi serie armonica)."}
- {"id": "serie-numeriche-4", "nome": "Criterio del rapporto", "latex": "L=\\lim\\left|\\frac{a_{n+1}}{a_n}\\right|:\\ L<1\\Rightarrow\\text{conv. assoluta},\\ L>1\\Rightarrow\\text{div.}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Se L=1 il criterio non decide."}
- {"id": "serie-numeriche-5", "nome": "Criterio di Leibniz", "latex": "a_n\\ge0,\\ a_n\\downarrow0\\Rightarrow\\sum(-1)^n a_n\\ \\text{converge}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "a_n decrescente e infinitesima."}
- {"id": "analisi-matematica-ii-1", "nome": "Gradiente", "latex": "\\nabla f=\\left(\\frac{\\partial f}{\\partial x},\\frac{\\partial f}{\\partial y},\\frac{\\partial f}{\\partial z}\\right)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "f differenziabile."}
- {"id": "analisi-matematica-ii-2", "nome": "Derivata direzionale", "latex": "\\partial_{\\mathbf v} f=\\nabla f\\cdot\\mathbf v", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "|v| = 1, f differenziabile."}
- {"id": "analisi-matematica-ii-3", "nome": "Condizione del second'ordine per due variabili", "latex": "\\det H>0,\\ f_{xx}>0\\Rightarrow\\text{minimo locale};\\ \\det H>0,\\ f_{xx}<0\\Rightarrow\\text{massimo locale};\\ \\det H<0\\Rightarrow\\text{sella}", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Nei punti stazionari, f di classe C²."}
