- {"id": "equazioni-differenziali-1", "nome": "Crescita o decadimento esponenziale", "latex": " y =  y0\\cdot\\exp\\left( k\\cdott\\right)", "expr": "y = y0*exp(k*t)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Soluzione di y'=ky con y(0)=y0.", "variabili": {"y": "Valore al tempo t", "y0": "Valore iniziale", "k": "Costante", "t": "Tempo"}}
- {"id": "equazioni-differenziali-2", "nome": "Soluzione della logistica", "latex": " P = \\frac{K}{1+\\frac{K- P0}{ P0}\\cdot\\exp\\left(- r\\cdott\\right)}", "expr": "P = K/(1 + ((K - P0)/P0)*exp(-r*t))", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "P'=rP(1−P/K), P(0)=P0>0.", "variabili": {"P": "Popolazione", "K": "Capacità portante", "P0": "Valore iniziale", "r": "Tasso", "t": "Tempo"}}
