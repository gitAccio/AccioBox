- {"id": "probabilita-6", "nome": "Distribuzione binomiale", "latex": " P = \\frac{\\left( n\\right)!}{\\left( k\\right)!\\cdot\\left( n- k\\right)!}\\cdot{ p}^{ k}\\cdot{\\left(1- p\\right)}^{ n- k}", "expr": "P = factorial(n)/(factorial(k)*factorial(n - k))*p^k*(1 - p)^(n - k)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Prove indipendenti con probabilità di successo p.", "variabili": {"P": "P(X = k) [-]", "n": "Numero di prove", "k": "Numero di successi", "p": "Probabilità di successo [-]"}}
