- {"id": "sistemi-elettrici-3", "nome": "Capacità di rifasamento (monofase)", "latex": " Cr = \\frac{ P\\cdot\\left( t1- t2\\right)}{\\omega\\cdot{V}^{2}}", "expr": "Cr = P*(t1 - t2)/(omega*V^2)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "t1 e t2 tangenti dell'angolo di sfasamento prima e dopo; V tensione ai capi della capacità.", "variabili": {"Cr": "Capacità [F]", "P": "Potenza attiva [W]", "t1": "tan φ iniziale [-]", "t2": "tan φ finale [-]", "omega": "Pulsazione [rad/s]", "V": "Tensione [V]"}}
