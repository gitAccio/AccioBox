- {"id":"macchine-termiche-1","nome":"Rendimento del ciclo Otto ideale","latex":"\\eta = 1-\\frac{1}{{ r}^{\\gamma-1}}","expr":"eta = 1 - 1/r^(gamma - 1)","stato":"da_verificare","fonte":"Teoria classica (da confrontare con un testo di riferimento)","ipotesi":"Ciclo ad aria standard, calori specifici costanti; r rapporto di compressione.","variabili":{"eta":"Rendimento [-]","r":"Rapporto di compressione [-]","gamma":"Rapporto cp/cv [-]"}}
- {"id":"macchine-termiche-2","nome":"Rendimento del ciclo Diesel ideale","latex":"\\eta = 1-\\frac{1}{{ r}^{\\gamma-1}}\\cdot\\frac{{ rc}^{\\gamma}-1}{\\gamma\\cdot\\left( rc-1\\right)}","expr":"eta = 1 - (1/r^(gamma - 1))*((rc^gamma - 1)/(gamma*(rc - 1)))","stato":"da_verificare","fonte":"Teoria classica (da confrontare con un testo di riferimento)","ipotesi":"Ciclo ad aria standard; rc rapporto di combustione isobara.","variabili":{"eta":"Rendimento [-]","r":"Rapporto di compressione [-]","rc":"Rapporto di combustione [-]","gamma":"Rapporto cp/cv [-]"}}
- {"id":"macchine-termiche-3","nome":"Rendimento del ciclo Brayton ideale","latex":"\\eta = 1-\\frac{1}{{ rp}^{\\frac{\\gamma-1}{\\gamma}}}","expr":"eta = 1 - 1/rp^((gamma - 1)/gamma)","stato":"da_verificare","fonte":"Teoria classica (da confrontare con un testo di riferimento)","ipotesi":"Ciclo ad aria standard; rp rapporto di pressione.","variabili":{"eta":"Rendimento [-]","rp":"Rapporto di pressione [-]","gamma":"Rapporto cp/cv [-]"}}
- {"id":"macchine-termiche-4","nome":"Lavoro specifico di compressione isoentropica","latex":" w = \\mathrm{cp}\\cdot T1\\cdot\\left({ rp}^{\\frac{\\gamma-1}{\\gamma}}-1\\right)","expr":"w = cp*T1*(rp^((gamma - 1)/gamma) - 1)","stato":"da_verificare","fonte":"Teoria classica (da confrontare con un testo di riferimento)","ipotesi":"Gas ideale con cp costante.","variabili":{"w":"Lavoro specifico [J/kg]","cp":"Calore specifico [J/(kg K)]","T1":"Temperatura ingresso [K]","rp":"Rapporto di pressione [-]","gamma":"Rapporto cp/cv [-]"}}
