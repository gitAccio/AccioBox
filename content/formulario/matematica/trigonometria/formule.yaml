- {"id": "trig-coseni", "nome": "Teorema del coseno (Carnot)", "latex": "c^2 = a^2+b^2-2ab\\cos\\gamma", "expr": "c^2 = a^2 + b^2 - 2*a*b*cos(gamma)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Triangolo qualsiasi; gamma opposto al lato c; usare la modalità angolare corretta.", "variabili": {"a": "Lato [m]", "b": "Lato [m]", "c": "Lato opposto a gamma [m]", "gamma": "Angolo [rad o deg secondo modalità]"}}
- {"id": "trigonometria-1", "nome": "Teorema dei seni", "latex": "\\frac{ a}{\\sin\\left(A\\right)} = \\frac{b}{\\sin\\left(B\\right)}", "expr": "a/sin(A) = b/sin(B)", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Triangolo qualsiasi; angoli nella modalità DEG/RAD attiva.", "variabili": {"a": "Lato opposto ad A", "A": "Angolo", "b": "Lato opposto a B", "B": "Angolo"}}
- {"id": "trigonometria-2", "nome": "Area del triangolo con due lati e l'angolo compreso", "latex": "A = \\frac{ a\\cdotb\\cdot\\sin\\left(\\gamma\\right)}{2}", "expr": "A = a*b*sin(gamma)/2", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "gamma è l'angolo tra a e b.", "variabili": {"A": "Area", "a": "Lato", "b": "Lato", "gamma": "Angolo compreso"}}
- {"id": "trigonometria-3", "nome": "Raggio della circonferenza circoscritta", "latex": " R = \\frac{ a}{2\\cdot\\sin\\left(A\\right)}", "expr": "R = a/(2*sin(A))", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Triangolo qualsiasi.", "variabili": {"R": "Raggio", "a": "Lato", "A": "Angolo opposto al lato a"}}
- {"id": "trigonometria-4", "nome": "Identità fondamentale", "latex": "\\sin^2\\alpha+\\cos^2\\alpha=1", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Valida per ogni angolo."}
- {"id": "trigonometria-5", "nome": "Formule di addizione", "latex": "\\sin(\\alpha\\pm\\beta)=\\sin\\alpha\\cos\\beta\\pm\\cos\\alpha\\sin\\beta,\\quad \\cos(\\alpha\\pm\\beta)=\\cos\\alpha\\cos\\beta\\mp\\sin\\alpha\\sin\\beta", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Valide per ogni coppia di angoli."}
- {"id": "trigonometria-6", "nome": "Formule di duplicazione", "latex": "\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha,\\quad \\cos 2\\alpha=\\cos^2\\alpha-\\sin^2\\alpha", "stato": "da_verificare", "fonte": "Teoria classica (da confrontare con un testo di riferimento)", "ipotesi": "Valide per ogni angolo."}
